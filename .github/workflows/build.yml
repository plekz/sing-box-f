name: build

on:
  push:
    branches: [ stable/**, refactor/** ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.22.x' ]
        target:
          - { os: linux,  arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: |
          mkdir -p bin
          GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} go build -trimpath -o bin/sing-box-${{ matrix.target.os }}-${{ matrix.target.arch }} ./cmd/sing-box
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: bin/sing-box-${{ matrix.target.os }}-${{ matrix.target.arch }}

